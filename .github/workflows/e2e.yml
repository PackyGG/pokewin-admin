name: E2E

# Why manual-trigger only (for now):
#
# The E2E suite talks to a real Postgres — both the Main DB (`DATABASE_URL`)
# and the Admin DB (`ADMIN_DATABASE_URL`). Standing up a disposable
# production-shaped database inside GitHub Actions requires either:
#   (a) exporting the full PostgreSQL schema SQL into a migration that can be
#       applied to a fresh `postgres:16` service container, or
#   (b) granting the runner read-only network access to a hosted staging DB.
#
# Neither lift has been signed off by the user yet, so the workflow runs on
# manual dispatch only. Once one of those paths is chosen, flip the `on:`
# stanza below to include `push: { branches: [claude/hungry-gould, main] }`
# and the `pull_request` trigger. Nothing else in the job body needs to
# change — the secrets already expect DATABASE_URL / ADMIN_DATABASE_URL /
# SESSION_SECRET / E2E_ADMIN_TOTP_SECRET.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL (optional — overrides webServer boot)"
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'e2e-admin@test.local' }}
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME || 'e2e_admin' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_USE_EXISTING_SERVER: ${{ inputs.base_url && '1' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Seed E2E admin user
        # Idempotent — safe to run on every invocation. Only writes to
        # the Admin DB, never the Main DB.
        run: npm run test:e2e:seed

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
